name: Weekly Data Pipeline

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6:00 AM UTC
  workflow_dispatch:       # Allow manual trigger for testing

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python scripts/automated_pipeline.py --input data/raw --output data/processed

      - name: Create output pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: pipeline-autorefresh
          base: main
          delete-branch: true
          commit-message: "pipeline: automated data refresh"
          title: "pipeline: automated data refresh"
          body: |
            Automated refresh of processed data files.

            Please review the generated output before merging.

  notify:
    needs: run-pipeline
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline failed: run ${context.runId}`,
              body: [
                `## Pipeline Failure`,
                ``,
                `**Run:** [${context.runId}](${runUrl})`,
                `**Triggered by:** ${context.eventName}`,
                `**Branch:** ${context.ref}`,
                `**Time:** ${new Date().toISOString()}`,
                ``,
                `### Next Steps`,
                `1. Check the [run logs](${runUrl}) for the specific error`,
                `2. Fix the issue and push a commit`,
                `3. Close this issue once the next pipeline run succeeds`,
              ].join('\n'),
              labels: ['pipeline-failure'],
            });
