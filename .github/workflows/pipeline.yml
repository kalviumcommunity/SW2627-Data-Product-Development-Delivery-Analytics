name: Weekly Data Pipeline

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6:00 AM UTC
  workflow_dispatch:       # Allow manual trigger for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python scripts/automated_pipeline.py --input data/raw --output data/processed

      - name: Commit output
        run: |
          git config user.name "Pipeline Bot"
          git config user.email "bot@example.com"
          git add data/processed/
          git diff --cached --quiet || git commit -m "pipeline: automated data refresh"
          git push

  notify:
    needs: run-pipeline
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline failed: run ${context.runId}`,
              body: [
                `## Pipeline Failure`,
                ``,
                `**Run:** [${context.runId}](${runUrl})`,
                `**Triggered by:** ${context.eventName}`,
                `**Branch:** ${context.ref}`,
                `**Time:** ${new Date().toISOString()}`,
                ``,
                `### Next Steps`,
                `1. Check the [run logs](${runUrl}) for the specific error`,
                `2. Fix the issue and push a commit`,
                `3. Close this issue once the next pipeline run succeeds`,
              ].join('\n'),
              labels: ['pipeline-failure'],
            });
